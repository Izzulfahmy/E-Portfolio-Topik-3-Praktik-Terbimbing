<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio PPG Prajabatan</title>
    <!-- Tab Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.png">
    <!-- Tailwind CSS & Font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .nav-btn-active {
            background-color: #2563eb !important; /* Blue 600 */
            color: #ffffff !important;
            border-color: #2563eb !important;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between pt-16 pb-4 px-2 sm:px-6">

    <!-- HEADER FLOATING BAR CONTAINER -->
    <div id="header-placeholder" class="w-full"></div>

    <!-- MAIN CONTAINER (TEMPAT KONTEN DIPANGGIL) -->
    <main id="portfolio-container" class="w-full max-w-6xl mx-auto my-auto flex-grow flex items-center justify-center">
        <!-- File dari folder pages/ akan masuk ke sini via Fetch -->
    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-6xl mx-auto text-center py-4 text-xs font-semibold text-slate-400 border-t border-slate-200/60 mt-4">
        <p>&copy; 2026 E-Portfolio PPG Prajabatan. All rights reserved.</p>
    </footer>

    <!-- SCRIPT FETCH UNTUK SEAMLESS TAB NAVIGATION -->
    <script>
        const pagesList = [
            'beranda.html',
            'daftar-isi.html',
            'profil.html',
            'pembelajaran.html',
            'praktik.html',
            'penilaian.html',
            'refleksi.html'
        ];

        // 1. Load Header Component
        async function initHeader() {
            try {
                const res = await fetch('components/header.html');
                if (res.ok) {
                    document.getElementById('header-placeholder').innerHTML = await res.text();
                    // Load awal halaman beranda
                    switchTab('beranda.html');
                }
            } catch (err) {
                console.error("Gagal memuat header:", err);
            }
        }

        // 2. Load Content Page di Background Tanpa Reload
        async function switchTab(pageFile) {
            const container = document.getElementById('portfolio-container');
            try {
                const res = await fetch(`pages/${pageFile}`);
                if (!res.ok) throw new Error('Halaman tidak ditemukan');
                const html = await res.text();
                
                // Masukkan konten secara instan
                container.innerHTML = html;
                
                // Update tampilan tombol aktif di header
                updateHeaderButtons(pageFile);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 border border-slate-200 text-center w-full shadow-sm">
                        <p class="text-slate-500 font-bold">Gagal memuat halaman ${pageFile}</p>
                    </div>
                `;
            }
        }

        // 3. Update Status Active Tombol Tab
        function updateHeaderButtons(activeFile) {
            const links = document.querySelectorAll('#header-placeholder nav a, #header-placeholder nav button');
            links.forEach(btn => {
                const href = btn.getAttribute('onclick') || '';
                if (href.includes(activeFile)) {
                    btn.classList.add('nav-btn-active');
                    btn.classList.remove('text-slate-500', 'border-transparent');
                } else {
                    btn.classList.remove('nav-btn-active');
                    btn.classList.add('text-slate-500');
                }
            });
        }

        // 4. Toggle Fullscreen
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Gagal layar penuh: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Jalankan saat halaman dibuka
        window.addEventListener('DOMContentLoaded', initHeader);
    </script>
</body>
</html>
