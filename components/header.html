<!-- FLOATING NAVBAR DESKTOP & MOBILE HEADER -->
<header class="fixed top-2 left-1/2 -translate-x-1/2 w-[96%] max-w-6xl z-50 bg-white/90 backdrop-blur-md rounded-2xl border border-slate-200/80 shadow-lg px-3 py-2 transition-all duration-300">
    <div class="flex items-center justify-between">
        
        <!-- LOGO & BRANDING -->
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('beranda.html')">
            <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-500/20">
                P
            </div>
            <div class="flex flex-col">
                <span class="font-extrabold text-xs md:text-sm text-slate-800 tracking-tight leading-tight">E-PORTFOLIO</span>
                <span class="text-[10px] font-semibold text-slate-400 leading-none">PPG Calon Guru</span>
            </div>
        </div>

        <!-- DESKTOP NAVIGATION MENU -->
        <nav class="hidden md:flex items-center gap-1 bg-slate-100/80 p-1 rounded-xl text-xs font-bold text-slate-600">
            <button onclick="switchTab('beranda.html')" class="tab-btn px-3 py-1.5 rounded-lg hover:text-blue-600 hover:bg-slate-200/60 transition-all cursor-pointer border-0 outline-none">
                Beranda
            </button>
            <button onclick="switchTab('profil.html')" class="tab-btn px-3 py-1.5 rounded-lg hover:text-blue-600 hover:bg-slate-200/60 transition-all cursor-pointer border-0 outline-none">
                Profil
            </button>
            <button onclick="switchTab('pembelajaran.html')" class="tab-btn px-3 py-1.5 rounded-lg hover:text-blue-600 hover:bg-slate-200/60 transition-all cursor-pointer border-0 outline-none">
                Pembelajaran
            </button>
            <button onclick="switchTab('praktik.html')" class="tab-btn px-3 py-1.5 rounded-lg hover:text-blue-600 hover:bg-slate-200/60 transition-all cursor-pointer border-0 outline-none">
                Non Mengajar
            </button>
            <button onclick="switchTab('penilaian.html')" class="tab-btn px-3 py-1.5 rounded-lg hover:text-blue-600 hover:bg-slate-200/60 transition-all cursor-pointer border-0 outline-none">
                Penilaian
            </button>
            <button onclick="switchTab('refleksi.html')" class="tab-btn px-3 py-1.5 rounded-lg hover:text-blue-600 hover:bg-slate-200/60 transition-all cursor-pointer border-0 outline-none">
                Refleksi
            </button>
        </nav>

        <!-- ACTION BUTTONS (FULLSCREEN TOGGLE) -->
        <div class="flex items-center gap-2">
            <button id="btn-fullscreen-toggle" title="Layar Penuh / Exit Fullscreen" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition-all cursor-pointer border-0 outline-none flex items-center justify-center">
                <!-- Icon Fullscreen Expand -->
                <svg id="icon-expand" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                </svg>
                <!-- Icon Fullscreen Collapse -->
                <svg id="icon-collapse" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9L4 4m0 0l5 5M4 4v4m0-4h4m11 5l-5-5m5 5v-4m0 4h-4m-5 11l5 5m0 0h-4m4 0v-4m-11 0l-5 5m5-5v4m0-4H4"/>
                </svg>
            </button>
        </div>

    </div>
</header>

<!-- MOBILE BOTTOM NAVIGATION (UNTUK TAMPILAN HP) -->
<div class="md:hidden fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] z-50 bg-white/95 backdrop-blur-md rounded-2xl border border-slate-200/80 shadow-xl px-2 py-1.5 flex items-center justify-around">
    <button onclick="switchTab('beranda.html')" class="tab-btn-mobile p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all cursor-pointer border-0 outline-none flex flex-col items-center">

        <span class="text-[9px] font-bold mt-0.5">Beranda</span>

    <button onclick="switchTab('profil.html')" class="tab-btn-mobile p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all cursor-pointer border-0 outline-none flex flex-col items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>

        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18c-2.305 0-4.408.867-6 2.292m0-14.25v14.25"/></svg>
        <span class="text-[9px] font-bold mt-0.5">Belajar</span>
    </button>
    <button onclick="switchTab('praktik.html')" class="tab-btn-mobile p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all cursor-pointer border-0 outline-none flex flex-col items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-[9px] font-bold mt-0.5">Non Mengajar</span>

    <button onclick="switchTab('penilaian.html')" class="tab-btn-mobile p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all cursor-pointer border-0 outline-none flex flex-col items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[9px] font-bold mt-0.5">Penilaian</span>
    </button>
    <button onclick="switchTab('refleksi.html')" class="tab-btn-mobile p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all cursor-pointer border-0 outline-none flex flex-col items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>

</div>
