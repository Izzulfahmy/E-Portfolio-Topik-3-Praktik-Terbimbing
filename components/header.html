<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio PPG Calon Guru</title>
    
    <!-- FAVICON LOGO UNEJ DI TAB BROWSER -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <!-- Tailwind CSS CDN & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        /* Merapikan tampilan scrollbar di desktop agar tetap estetik */
        main::-webkit-scrollbar {
            width: 6px;
        }
        main::-webkit-scrollbar-track {
            background: transparent;
        }
        main::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        main::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between pt-16 md:pt-20 pb-20 md:pb-4 px-2 sm:px-6">

    <!-- WADAH HEADER OTOMATIS (FLOATING BAR DESKTOP & MOBILE) -->
    <div id="header-placeholder" class="w-full"></div>

    <!-- MAIN CONTAINER -->
    <main id="portfolio-container" class="w-full max-w-6xl mx-auto my-auto flex-grow flex items-start justify-center min-h-[calc(100vh-6rem)] max-h-[calc(100vh-6rem)] overflow-y-auto">
        <!-- File dari folder pages/ akan masuk ke sini via Fetch -->
    </main>

    <!-- FOOTER GLOBAL -->
    <footer class="w-full max-w-6xl mx-auto text-center py-4 text-xs font-semibold text-slate-400 border-t border-slate-200/60 mt-4">
        <p>&copy; 2026 E-Portfolio PPG Calon Guru. All rights reserved.</p>
    </footer>

    <!-- SCRIPT SINGLE PAGE APPLICATION & LOGIKA FULLSCREEN UNIVERSAL -->
    <script>
        const pagesList = [
            'beranda.html',
            'profil.html',
            'pembelajaran.html',
            'praktik.html',
            'penilaian.html',
            'refleksi.html'
        ];

        // 1. Load Komponen Header
        async function initHeader() {
            try {
                const res = await fetch('components/header.html');
                if (res.ok) {
                    document.getElementById('header-placeholder').innerHTML = await res.text();
                    
                    // Pasang event listener ke tombol Fullscreen setelah header selesai di-load
                    setupFullscreenButton();
                    
                    // Load halaman awal
                    switchTab('beranda.html');
                }
            } catch (err) {
                console.error("Gagal memuat header:", err);
            }
        }

        // 2. Load Konten Halaman di Background Tanpa Reload
        async function switchTab(pageFile) {
            const container = document.getElementById('portfolio-container');
            try {
                const res = await fetch(`pages/${pageFile}`);
                if (!res.ok) throw new Error('Halaman tidak ditemukan');
                const html = await res.text();
                
                container.innerHTML = html;
                updateHeaderButtons(pageFile);
                
                // Reset posisi scroll kontainer utama ke paling atas tiap ganti menu
                container.scrollTop = 0;
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 border border-slate-200 text-center w-full shadow-sm">
                        <p class="text-slate-500 font-bold">Gagal memuat halaman ${pageFile}</p>
                    </div>
                `;
            }
        }

        // 3. Update Status Warna Tombol Aktif
        function updateHeaderButtons(activeFile) {
            // Desktop Header
            const desktopButtons = document.querySelectorAll('#header-placeholder nav button.tab-btn');
            desktopButtons.forEach(btn => {
                const onclickAttr = btn.getAttribute('onclick') || '';
                if (onclickAttr.includes(activeFile)) {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold shadow-sm transition-all cursor-pointer border-0 outline-none";
                } else {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all cursor-pointer border-0 outline-none";
                }
            });

            // Mobile Bottom Nav
            const mobileButtons = document.querySelectorAll('#header-placeholder nav button.tab-btn-mobile');
            mobileButtons.forEach(btn => {
                const onclickAttr = btn.getAttribute('onclick') || '';
                if (onclickAttr.includes(activeFile)) {
                    btn.className = "tab-btn-mobile p-2 rounded-xl bg-blue-600 text-white shadow-md transition-all cursor-pointer border-0 outline-none";
                } else {
                    btn.className = "tab-btn-mobile p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-all cursor-pointer border-0 outline-none";
                }
            });
        }

        // 4. SISTEM LOGIKA FULLSCREEN UNIVERSAL DENGAN EVENT LISTENER DIRECT
        function setupFullscreenButton() {
            const btnFS = document.getElementById('btn-fullscreen-toggle');
            if (!btnFS) return;

            btnFS.addEventListener('click', function(e) {
                e.preventDefault();
                
                const doc = document;
                const docEl = document.documentElement;

                // Cek API vendor browser
                const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                const exitFS = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
                const isFS = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

                if (!isFS) {
                    if (requestFS) {
                        requestFS.call(docEl).catch(err => alert("Layar penuh tidak diizinkan oleh browser: " + err.message));
                    }
                } else {
                    if (exitFS) {
                        exitFS.call(doc);
                    }
                }
            });
        }

        // 5. PENYESUAIAN IKON FULLSCREEN OTOMATIS SAAT KELUAR/MASUK (TERMASUK TOMBOL ESC)
        function updateFullscreenIcons() {
            const iconExpand = document.getElementById('icon-expand');
            const iconCollapse = document.getElementById('icon-collapse');
            const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

            if (iconExpand && iconCollapse) {
                if (isFS) {
                    iconExpand.classList.remove('block');
                    iconExpand.classList.add('hidden');
                    iconCollapse.classList.remove('hidden');
                    iconCollapse.classList.add('block');
                } else {
                    iconExpand.classList.remove('hidden');
                    iconExpand.classList.add('block');
                    iconCollapse.classList.remove('block');
                    iconCollapse.classList.add('hidden');
                }
            }
        }

        // Hubungkan event pemicu perubahan fullscreen dari browser
        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(event => {
            document.addEventListener(event, updateFullscreenIcons);
        });

        // Inisialisasi saat aplikasi pertama dibuka
        window.addEventListener('DOMContentLoaded', initHeader);
    </script>
</body>
</html>
